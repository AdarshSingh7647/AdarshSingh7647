<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 136" width="1000" height="136" role="img" aria-labelledby="t">
  <title id="t">ACL 2026 co-first-author paper; up to 33x fewer online embedding calls; +25% Acc@10 over base Qwen3-8B; 1M+ tables at 95% Recall@20</title>
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/><stop offset="0.55" stop-color="#edf1ff"/><stop offset="1" stop-color="#e4f6fb"/>
    </linearGradient>
    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5646e0"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="g-funnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5646e0" stop-opacity="0.06"/><stop offset="1" stop-color="#0891b2" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0b1020" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#5646e0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5646e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="136" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .flow  { animation: flow 5s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes flow  { to { stroke-dashoffset: -90; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .flow { animation: none; } }
  </style>
  <rect x="0.0" y="0.5" width="239.5" height="135" rx="14" fill="#ffffff" stroke="#d5dcf2"/><text x="18.0" y="28" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4b5782">PUBLISHED</text><text x="18.0" y="70" font-size="34" font-weight="800" fill="url(#g-accent)">ACL 2026</text><text x="18.0" y="99" font-size="13" fill="#0b1020" fill-opacity="0.85">CRAFT · co-first author, main</text><text x="18.0" y="117" font-size="13" fill="#4b5782">conference (long paper)</text><rect x="253.5" y="0.5" width="239.5" height="135" rx="14" fill="#ffffff" stroke="#d5dcf2"/><text x="271.5" y="28" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4b5782">UP TO</text><text x="271.5" y="70" font-size="42" font-weight="800" fill="url(#g-accent)">33×</text><text x="271.5" y="99" font-size="13" fill="#0b1020" fill-opacity="0.85">fewer online embedding calls</text><text x="271.5" y="117" font-size="13" fill="#4b5782">and 70% shorter contexts</text><rect x="507.0" y="0.5" width="239.5" height="135" rx="14" fill="#ffffff" stroke="#d5dcf2"/><text x="525.0" y="28" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4b5782">POST-TRAINING</text><text x="525.0" y="70" font-size="42" font-weight="800" fill="url(#g-accent)">+25%</text><text x="525.0" y="99" font-size="13" fill="#0b1020" fill-opacity="0.85">relative Acc@10 vs Qwen3-8B</text><text x="525.0" y="117" font-size="13" fill="#4b5782">0.57 → 0.71 · 4 OOD sets</text><rect x="760.5" y="0.5" width="239.5" height="135" rx="14" fill="#ffffff" stroke="#d5dcf2"/><text x="778.5" y="28" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4b5782">SCALE</text><text x="778.5" y="70" font-size="42" font-weight="800" fill="url(#g-accent)">1M+</text><text x="778.5" y="99" font-size="13" fill="#0b1020" fill-opacity="0.85">tables in a FAISS-HNSW index</text><text x="778.5" y="117" font-size="13" fill="#4b5782">at 95% Recall@20</text>
</svg>
