  <title id="t">Adarsh Singh, Machine Learning Engineer</title>
  <desc id="d">LLM post-training, retrieval and ranking, evaluation infrastructure. ACL 2026 co-first author, Founding Engineer (Machine Learning) at Noah Labs, ASU CoRAL Lab.</desc>
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/><stop offset="0.55" stop-color="#edf1ff"/><stop offset="1" stop-color="#e4f6fb"/>
    </linearGradient>
    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="0">
